name: Split

# Composer installs a package only from a repository whose root holds its
# composer.json, so each package is pushed on a tag to a read-only repository
# of its own, which Packagist serves. The monorepo stays where work happens.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  split:
    name: Split ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [cms, ui, ai, mcp, site, page-builder, parts, forms]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893 # v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
        with:
          package_directory: packages/${{ matrix.package }}
          repository_organization: mainstaycms
          repository_name: ${{ matrix.package }}
          branch: main
          tag: ${{ github.ref_name }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
